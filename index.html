<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rehearsal Room — Raise Negotiation Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  /* ---- Nocturne design tokens ---- */
  :root{
    --color-bg: #161826;
    --color-surface: #232532;
    --color-text: #e9e9ed;
    --color-accent: #9184d9;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

    --color-neutral-100: #f3f5fe;
    --color-neutral-200: #e4e7f5;
    --color-neutral-300: #cfd3e5;
    --color-neutral-400: #b2b6ca;
    --color-neutral-500: #9397ab;
    --color-neutral-600: #75798c;
    --color-neutral-700: #595d6c;
    --color-neutral-800: #3f424d;
    --color-neutral-900: #292b31;

    --color-accent-100: #f5f4ff;
    --color-accent-200: #e7e5fe;
    --color-accent-300: #d2cefd;
    --color-accent-400: #b5abfc;
    --color-accent-500: #968ae0;
    --color-accent-600: #796cbf;
    --color-accent-700: #5d5294;
    --color-accent-800: #423a6a;
    --color-accent-900: #2b2741;

    --font-heading: "Inter", system-ui, sans-serif;
    --font-heading-weight: 500;
    --font-body: "Inter", system-ui, sans-serif;

    --space-1: 2.8px;
    --space-2: 5.6px;
    --space-3: 8.4px;
    --space-4: 11.2px;
    --space-6: 16.8px;
    --space-8: 22.4px;

    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 14px;

    --shadow-sm: 0 0 0 1px #3f424d;
    --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
    --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
  }
  *, *::before, *::after{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background:var(--color-bg); color:var(--color-text); font-family:var(--font-body);
    font-size:15px; line-height:1.55; font-weight:400; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,h5,h6{
    font-family:var(--font-heading); font-weight:var(--font-heading-weight);
    line-height:1.12; letter-spacing:-0.015em; margin:0 0 var(--space-2);
  }
  h1{ font-size:30px; } h2{ font-size:24px; } h3{ font-size:20px; } h4{ font-size:18px; } h5{ font-size:15px; }
  p{ margin:0 0 var(--space-3); }
  a{ color:var(--color-accent); text-underline-offset:3px; }
  ::selection{ background:color-mix(in srgb, var(--color-accent) 30%, transparent); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--color-divider); border-radius:8px; }
  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px; }
  .text-muted{ color:color-mix(in srgb, var(--color-text) 55%, transparent); }

  .hr{
    height:1px; border:0; margin:0;
    background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent);
  }

  /* ---- buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; text-decoration:none; font-family:var(--font-heading); font-weight:var(--font-heading-weight);
    font-size:14px; line-height:1.2; color:var(--color-text); background:transparent; border:1px solid transparent;
    padding:var(--space-2) calc(var(--space-3) * 1.2); border-radius:var(--radius-md); white-space:nowrap;
  }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ color:var(--color-accent); border-color:var(--color-accent); }
  .btn-primary:hover:not(:disabled){ background:color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .btn-primary:active:not(:disabled){ background:color-mix(in srgb, var(--color-accent) 22%, transparent); }
  .btn-secondary{ border-color:var(--color-divider); }
  .btn-secondary:hover:not(:disabled){ background:color-mix(in srgb, var(--color-text) 7%, transparent); }
  .btn-ghost{ color:var(--color-accent); padding-inline:var(--space-1); border:none; }
  .btn-ghost:hover:not(:disabled){ background:color-mix(in srgb, var(--color-accent) 10%, transparent); }
  .btn-block{ width:100%; }

  /* ---- forms ---- */
  .field{ margin-bottom:var(--space-4); }
  .field label{ display:block; font-size:12px; margin-bottom:5px; color:color-mix(in srgb, var(--color-text) 70%, transparent); }
  .input{
    width:100%; min-height:36px; padding:8px 11px; font:inherit; font-size:14px; color:var(--color-text);
    caret-color:var(--color-accent); background:var(--color-surface); border:1px solid var(--color-divider);
    border-radius:var(--radius-md);
  }
  .input:hover{ border-color:color-mix(in srgb, var(--color-text) 45%, transparent); }
  .input:focus-visible{ border-color:var(--color-accent); outline-offset:0; }
  textarea.input{ min-height:80px; resize:vertical; font-family:inherit; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }
  .seg{ display:inline-flex; overflow:hidden; border:1px solid var(--color-divider); border-radius:var(--radius-md); }
  .seg-opt{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .seg-opt input{ position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
  .seg-opt + .seg-opt{ border-left:1px solid var(--color-divider); }
  .seg-opt:has(input:checked){ color:var(--color-accent); box-shadow:inset 0 0 0 1px var(--color-accent); }
  .seg-opt:not(:has(input:checked)):hover{ background:color-mix(in srgb, var(--color-text) 7%, transparent); }

  /* ---- cards ---- */
  .card{ display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-md); background:var(--color-surface); }
  .card-kicker{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent); }
  .elev-sm{ box-shadow:var(--shadow-sm); }
  .elev-lg{ box-shadow:var(--shadow-lg); }

  /* ---- tags ---- */
  .tag{ display:inline-flex; align-items:center; font-size:11px; letter-spacing:0.02em; padding:3px 10px; border-radius:calc(var(--radius-md) * 0.75); white-space:nowrap; }
  .tag-accent{ background:var(--color-accent-800); color:var(--color-accent-100); }
  .tag-outline{ border:1px solid var(--color-accent); color:var(--color-accent); }

  /* ---- dialog ---- */
  .dialog-backdrop{ position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:var(--space-4); background:color-mix(in srgb, var(--color-neutral-900) 55%, transparent); }
  .dialog{ width:min(440px, 100%); display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius-lg); background:var(--color-surface); box-shadow:var(--shadow-lg); }
  .dialog-title{ font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:19px; margin:0; }
  .dialog-body{ font-size:14px; opacity:0.85; margin:0; }
  .dialog-actions{ display:flex; justify-content:flex-end; gap:var(--space-2); margin-top:var(--space-2); flex-wrap:wrap; }

  @keyframes pulse{ 0%,100%{ opacity:0.4; } 50%{ opacity:1; } }
  @keyframes livepulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .skeleton-bar{ background:var(--color-neutral-800); border-radius:var(--radius-sm); animation:pulse 1.4s ease-in-out infinite; }
  .live-dot{ animation:livepulse 1.3s ease-in-out infinite; }

  /* ---- app shell ---- */
  .app-shell{ min-height:100vh; display:flex; }
  .sidebar{
    width:224px; flex:none; background:var(--color-surface); box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; padding:var(--space-4) var(--space-3); gap:var(--space-6);
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{ width:32px; height:32px; border-radius:var(--radius-md); border:1px solid var(--color-accent); display:flex; align-items:center; justify-content:center; color:var(--color-accent); font-size:16px; flex:none; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand-name{ font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:15.5px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent); }
  .sidebar-nav{ display:flex; flex-direction:column; gap:3px; }
  .sidebar-nav-btn{
    display:flex; align-items:center; gap:10px; border:none; cursor:pointer; text-align:left;
    padding:9px 10px; border-radius:var(--radius-md); font-size:13.5px; font-weight:600; font-family:inherit;
    background:transparent; color:color-mix(in srgb, var(--color-text) 70%, transparent);
  }
  .sidebar-nav-btn i{ font-size:16px; flex:none; }
  .sidebar-nav-btn.active{ background:color-mix(in srgb, var(--color-accent) 12%, transparent); color:var(--color-accent); }
  .sidebar-footer{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .sidebar-tagline{ font-size:11.5px; color:color-mix(in srgb, var(--color-text) 55%, transparent); }
  .sidebar-user{ font-size:11px; color:color-mix(in srgb, var(--color-text) 45%, transparent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-area{ flex:1; min-width:0; overflow-y:auto; }
  .main-area.flush{ height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  .screen{ padding:var(--space-8) 40px 64px; display:flex; flex-direction:column; gap:var(--space-6); }

  /* ---- setup ---- */
  .optional-panel{
    background:color-mix(in srgb, var(--color-text) 4%, var(--color-surface)); border:1px solid var(--color-divider);
    border-radius:var(--radius-md); padding:var(--space-6); display:flex; flex-direction:column; gap:var(--space-4);
  }
  .setup-columns{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }
  @media (max-width:640px){ .setup-columns{ grid-template-columns:1fr; } }
  .setup-actions{ position:sticky; bottom:0; background:var(--color-bg); padding:var(--space-3) 0 var(--space-2); z-index:5; display:flex; flex-direction:column; gap:8px; }

  /* ---- plan ---- */
  .plan-section{ padding:var(--space-4); gap:8px; }
  .plan-bullet{ display:flex; gap:8px; align-items:flex-start; }
  .plan-bullet .dot{ color:var(--color-accent); margin-top:9px; flex:none; font-size:8px; }
  .plan-bullet li{ flex:1; list-style:none; outline:none; border-radius:var(--radius-sm); padding:4px 6px; margin-left:-6px; font-size:14px; }
  .plan-bullet li:hover{ background:color-mix(in srgb, var(--color-text) 5%, transparent); }
  .plan-bullet li:focus{ background:color-mix(in srgb, var(--color-text) 5%, var(--color-surface)); box-shadow:0 0 0 1px var(--color-divider); }
  .plan-script{ font-style:italic; border-left:2px solid var(--color-accent); padding:2px 0 2px 10px; margin:4px 0; font-size:13.5px; opacity:0.9; }
  .plan-script span:focus{ outline:none; background:color-mix(in srgb, var(--color-text) 5%, transparent); border-radius:var(--radius-sm); }
  .plan-risk{ display:flex; gap:6px; align-items:flex-start; font-size:12.5px; margin:2px 0 0; color:oklch(78% 0.09 78); }
  .plan-risk i{ margin-top:2px; flex:none; }
  .plan-risk span:focus{ outline:none; }
  .plan-context{ white-space:pre-wrap; }
  .plan-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(400px, 1fr)); gap:var(--space-4); }

  /* ---- live ---- */
  .live-toolbar{ padding:20px 40px 0; display:flex; flex-direction:column; gap:16px; flex:none; }
  .live-toolbar-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .live-body{ flex:1; display:flex; gap:20px; padding:14px 40px 24px; overflow:hidden; min-height:0; }
  .live-chat{ flex:0 0 63%; display:flex; flex-direction:column; min-width:0; }
  .live-sidebar{ flex:0 0 34%; display:flex; flex-direction:column; gap:14px; overflow-y:auto; padding:4px; }
  .msg-scroll{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:8px 4px; min-height:0; }
  .msg-row{ display:flex; }
  .msg-row.you{ justify-content:flex-end; }
  .msg-row.them{ justify-content:flex-start; }
  .msg{ max-width:74%; padding:11px 15px; border-radius:var(--radius-lg); font-size:14px; line-height:1.55; white-space:pre-wrap; }
  .msg .role-tag{ display:block; font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; opacity:0.6; margin-bottom:2px; }
  .msg.you{ background:var(--color-accent-800); color:var(--color-accent-100); }
  .msg.them{ background:var(--color-surface); color:var(--color-text); box-shadow:var(--shadow-sm); }
  .composer-row{ display:flex; gap:10px; padding-top:12px; flex:none; }
  .composer-row .input{ flex:1; }

  /* ---- history ---- */
  .attempt-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .attempt-card{ cursor:pointer; padding:var(--space-4); gap:8px; }
  .attempt-date{ font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:color-mix(in srgb, var(--color-text) 45%, transparent); }

  .two-col{ display:grid; grid-template-columns:62% 1fr; gap:24px; }

  /* ---- mobile ---- */
  @media (max-width:880px){
    .live-layout, .two-col{ grid-template-columns:1fr; }
    .two-col{ gap:16px; }
  }
  @media (max-width:820px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:static; flex-direction:row; align-items:center; flex-wrap:wrap; gap:var(--space-3); padding:var(--space-3); }
    .sidebar-brand{ flex:none; }
    .sidebar-nav{ flex-direction:row; flex:1; overflow-x:auto; }
    .sidebar-footer{ display:none; }
    .main-area.flush{ height:auto; overflow:visible; }
    .live-body{ flex-direction:column; overflow:visible; }
    .live-chat, .live-sidebar{ flex:1 1 auto; }
    .msg-scroll{ max-height:50vh; }
  }
  @media (max-width:640px){
    .screen{ padding:var(--space-6) 18px 48px; }
    .row2{ grid-template-columns:1fr; }
    .live-toolbar{ padding:16px 18px 0; }
    .live-body{ padding:14px 18px 20px; }
    .msg{ max-width:90%; }
  }
</style>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ---------------- Supabase config ---------------- */
/* Replace these two with the values from Supabase > Project Settings > API.
   The anon key is safe to expose here — row-level security restricts access. */
const SUPABASE_URL = "https://jetosossjsgmhqjydazp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpldG9zb3NzanNnbWhxanlkYXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NDIxMzEsImV4cCI6MjEwMDQxODEzMX0.HKBauBOEuCpCO_T_KFJmrexbLkJ1nlBXhLZsrzI_fmM";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- Auth state ---------------- */
let SESSION = null;
let AUTH_ERROR = '';
let AUTH_BUSY = false;

async function initAuth(){
  const { data: { session } } = await supabase.auth.getSession();
  SESSION = session;
  supabase.auth.onAuthStateChange(async (_event, session)=>{
    const hadSession = !!SESSION;
    SESSION = session;
    if(SESSION && !hadSession){ await loadData(); }
    if(!SESSION){ DATA = { scenarios: [], attempts: [] }; draft = null; VIEW = 'home'; }
    render();
  });
}

/* ---------------- Data layer (Supabase-backed) ---------------- */
let DATA = { scenarios: [], attempts: [] };

async function loadData(){
  if(!SESSION) return;
  try{
    const [{ data: scenarios, error: e1 }, { data: attempts, error: e2 }] = await Promise.all([
      supabase.from('scenarios').select('*').order('created_at', { ascending: true }),
      supabase.from('attempts').select('*').order('created_at', { ascending: true })
    ]);
    if(e1) console.error(e1);
    if(e2) console.error(e2);
    DATA.scenarios = (scenarios||[]).map(s=>({
      id: s.id, name: s.name, title: s.title, goal: s.goal,
      mgrName: s.mgr_name, mgrDisp: s.mgr_disp, groupKey: s.group_key,
      companySize: s.company_size, yearsExperience: s.years_experience, companyCulture: s.company_culture,
      batna: s.batna, timeline: s.timeline
    }));
    DATA.attempts = (attempts||[]).map(a=>({
      id: a.id, scenarioId: a.scenario_id, framework: a.framework, concepts: a.concepts,
      plan: a.plan, transcript: a.transcript, summaryTags: a.summary_tags,
      outcome: a.outcome, status: a.status, createdAt: new Date(a.created_at).getTime()
    }));
  }catch(e){ console.error('loadData failed', e); }
}

async function createScenario(prefill, groupKey){
  const { data, error } = await supabase.from('scenarios').insert({
    user_id: SESSION.user.id, name: prefill.name, title: prefill.title, goal: prefill.goal,
    mgr_name: prefill.mgrName || null, mgr_disp: prefill.mgrDisp || null, group_key: groupKey,
    company_size: prefill.companySize || null, years_experience: prefill.yearsExperience || null, company_culture: prefill.companyCulture || null,
    batna: prefill.batna || null, timeline: prefill.timeline || null
  }).select().single();
  if(error){ console.error(error); return null; }
  const sc = {
    id:data.id, name:data.name, title:data.title, goal:data.goal, mgrName:data.mgr_name, mgrDisp:data.mgr_disp, groupKey:data.group_key,
    companySize:data.company_size, yearsExperience:data.years_experience, companyCulture:data.company_culture,
    batna:data.batna, timeline:data.timeline
  };
  DATA.scenarios.push(sc);
  return sc;
}

function uid(){ return crypto.randomUUID(); }
function groupKeyFor(name,title,goal){
  return (name.trim()+'|'+title.trim()+'|'+goal.trim()).toLowerCase();
}

async function deleteAttemptRecord(id){
  if(!id) return;
  const { error } = await supabase.from('attempts').delete().eq('id', id);
  if(error) console.error('deleteAttemptRecord failed', error);
  DATA.attempts = DATA.attempts.filter(a=>a.id!==id);
}

/* ---------------- AI helper (routed through our serverless proxy) ---------------- */
async function askAI(system, messages, wantJSON){
  let text = '';
  try{
    const res = await fetch('/api/negotiate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system, messages })
    });
    const data = await res.json();
    if(!res.ok){ console.error('AI proxy error', data); }
    text = data.text || '';
  }catch(e){ console.error('askAI failed', e); }

  if(wantJSON){
    const cleaned = text.replace(/```json/g,'').replace(/```/g,'').trim();
    try{ return JSON.parse(cleaned); }
    catch(e){
      const match = cleaned.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
      if(match){ try{ return JSON.parse(match[0]); }catch(e2){} }
      return null;
    }
  }
  return text;
}

/* ---------------- App state ---------------- */
let VIEW = 'home'; // home | setup | plan | live | detail | settings
let draft = null;     // in-progress setup+plan+attempt object being built
let historyDetail = null; // attempt id being viewed read-only
let planLoading = false;
let liveLoading = false;
let summaryLoading = false;
let showLeaveDialog = false;

const DETAIL_KEY = 'accord-response-detail-v1';
let RESPONSE_DETAIL = 'concise'; // 'concise' | 'detailed'

function loadResponseDetail(){
  try{
    const v = localStorage.getItem(DETAIL_KEY);
    if(v === 'concise' || v === 'detailed') RESPONSE_DETAIL = v;
  }catch(e){}
}
function setResponseDetail(v){
  RESPONSE_DETAIL = v;
  try{ localStorage.setItem(DETAIL_KEY, v); }catch(e){}
  render();
}

const FRAMEWORKS = [
  { id: 'seven', label: 'Seven Elements' },
  { id: 'core', label: 'Core Concerns' },
  { id: 'anchor', label: 'Anchor & Legitimacy' },
  { id: 'multi', label: 'Multi-issue Expansion' },
  { id: 'two', label: '2 Elements (Interests + BATNA)' }
];
const STEP_LABELS = ['Set the scene', 'Prep plan', 'Practice'];

const COMPANY_SIZES = [
  { id: '1-10', label: '1–10 people — early-stage startup' },
  { id: '11-50', label: '11–50 people — startup' },
  { id: '51-500', label: '51–500 people — mid-size / scale-up' },
  { id: '501-5000', label: '501–5,000 people — large company' },
  { id: '5000+', label: '5,000+ people — enterprise' },

  { id: '6-10', label: '6–10 years — senior' },

  { id: 'corporate', label: 'Corporate / enterprise — structured, slower approvals' },

const BATNA_EXAMPLES = [
  'A verbal offer from another company at a similar level, not yet formal.',
  'Actively interviewing elsewhere; nothing signed yet.',
  'Could move to an adjacent internal team with a modest bump.',
  'No concrete alternative yet — mostly leverage of being hard to replace right now.',

function frameworkLabel(id){
  const f = FRAMEWORKS.find(f=>f.id===id);
  return f ? f.label : '2 Elements (Interests + BATNA)';
}
function companySizeLabel(id){ const o = COMPANY_SIZES.find(o=>o.id===id); return o ? o.label : ''; }
function yearsExperienceLabel(id){ const o = YEARS_EXPERIENCE.find(o=>o.id===id); return o ? o.label : ''; }
function companyCultureLabel(id){ const o = COMPANY_CULTURES.find(o=>o.id===id); return o ? o.label : ''; }

// Harmonious hues sharing the accent's tonal weight (L≈30%/92%, C≈0.075/0.035) — badges
// read as one tonal family stretched across hue, not an unrelated rainbow.
const HUES = { accent:289, indigo:255, blue:228, cyan:200, teal:176, green:142, amber:78, rose:18 };
function tone(hue){ return { bg:'oklch(30% 0.075 '+hue+')', color:'oklch(92% 0.035 '+hue+')' }; }
const FRAMEWORK_HUES = { seven:HUES.indigo, core:HUES.teal, anchor:HUES.amber, multi:HUES.cyan, two:HUES.accent };
const SUMMARY_TYPE_HUES = { anchor:HUES.green, pushback:HUES.rose, term:HUES.blue };

function outcomeHue(status, outcome){
  if(status === 'in-progress') return HUES.accent;
  const t = (outcome||'').toLowerCase();
  if(/agree|deal|approved|sounds fair|move forward/.test(t)) return HUES.green;
  if(/held|no budget|can't|unable|not able/.test(t)) return HUES.rose;
  if(/defer|review|later|circle back|next quarter/.test(t)) return HUES.amber;
  return HUES.blue;
}

function renderStepper(activeIndex){
  const items = STEP_LABELS.map((label, i)=>{
    const filled = i <= activeIndex;
    return {
      label, number: i+1,
      circleBg: filled ? 'var(--color-accent-800)' : 'transparent',
      circleColor: filled ? 'var(--color-accent-100)' : 'color-mix(in srgb, var(--color-text) 45%, transparent)',
      circleBorder: filled ? 'var(--color-accent)' : 'var(--color-divider)',
      textColor: filled ? 'var(--color-text)' : 'color-mix(in srgb, var(--color-text) 45%, transparent)',
      lineColor: i < activeIndex ? 'var(--color-accent)' : 'var(--color-divider)',
      hasNext: i < STEP_LABELS.length - 1,
    };
  });
  return `<div style="display:flex;align-items:center;gap:0">
    ${items.map(it=>`
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:${it.circleBg};color:${it.circleColor};border:1px solid ${it.circleBorder};flex:none">${it.number}</div>
        <span style="font-size:13px;font-weight:600;color:${it.textColor}">${esc(it.label)}</span>
      </div>
      ${it.hasNext ? `<div style="width:32px;height:1px;background:${it.lineColor};margin:0 10px;flex:none"></div>` : ''}
    `).join('')}
  </div>`;
}

/* ---------------- Screen: Home ---------------- */
function groupAttempts(){
  const groups = {};
  DATA.scenarios.forEach(s=>{ groups[s.groupKey] = { meta: s, attempts: [] }; });
  DATA.attempts.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(at=>{
    const sc = DATA.scenarios.find(s=>s.id===at.scenarioId);
    if(!sc) return;
    if(!groups[sc.groupKey]) groups[sc.groupKey] = { meta: sc, attempts: [] };
    groups[sc.groupKey].attempts.push(at);
  });
  return Object.values(groups).filter(g=>g.attempts.length>0)
    .sort((a,b)=> Math.max(...b.attempts.map(x=>x.createdAt)) - Math.max(...a.attempts.map(x=>x.createdAt)) );
}

  return groupList.map(g=>`

      <div class="attempt-grid">
        ${g.attempts.map(at=>{
          const isInProgress = at.status === 'in-progress';
          const label = isInProgress ? 'In progress' : (at.outcome || 'Completed');
          const t = tone(outcomeHue(at.status, at.outcome));
          return `
          <div class="card elev-sm attempt-card" data-attempt="${at.id}">
            <span class="attempt-date">${new Date(at.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>

            <span class="tag" style="align-self:flex-start;background:${t.bg};color:${t.color}">${esc(label)}</span>
            ${isInProgress
              ? `<button class="btn btn-primary btn-resume" data-attempt="${at.id}" style="align-self:flex-start;font-size:12px;padding:6px 12px">Resume</button>`
              : `<button class="btn btn-ghost btn-try-different" data-scenario="${g.meta.id}" style="align-self:flex-start;font-size:12px;padding:2px 4px">Try a different approach</button>`}
          </div>`;
        }).join('')}
      </div>
    </section>
  `).join('');
}

function wireSetupValidation(){
  const nameEl = document.getElementById('f-name');
  const titleEl = document.getElementById('f-title');
  const goalEl = document.getElementById('f-goal');
  const btn = document.getElementById('btn-build-plan');

}

/* ---------------- Actions ---------------- */
function reuseScenario(scId){
  const sc = DATA.scenarios.find(s=>s.id===scId);
  if(!sc) return;
  draft = { prefill: { name: sc.name, title: sc.title, goal: sc.goal, mgrName: sc.mgrName, mgrDisp: sc.mgrDisp, companySize: sc.companySize, yearsExperience: sc.yearsExperience, companyCulture: sc.companyCulture, batna: sc.batna, timeline: sc.timeline }, concepts: [], existingScenarioId: sc.id };
  VIEW = 'setup';
  render();
}

function resumeAttempt(at){
  const sc = DATA.scenarios.find(s=>s.id===at.scenarioId);
  if(!sc) return;
  draft = {
    prefill: { name: sc.name, title: sc.title, goal: sc.goal, mgrName: sc.mgrName, mgrDisp: sc.mgrDisp, companySize: sc.companySize, yearsExperience: sc.yearsExperience, companyCulture: sc.companyCulture, batna: sc.batna, timeline: sc.timeline },
    framework: at.framework, concepts: at.concepts || [],
    existingScenarioId: sc.id, scenarioId: sc.id, attemptId: at.id,
    plan: at.plan, transcript: at.transcript || [], summaryTags: at.summaryTags || [],
    outcome: at.outcome || null, createdAt: at.createdAt, planCollapsed: false,
  };
  VIEW = 'live';
  render();
}

async function onBuildPlan(){
  const name = document.getElementById('f-name').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const goal = document.getElementById('f-goal').value.trim();
  const mgrName = document.getElementById('f-mgr-name').value.trim();
  const mgrDisp = document.getElementById('f-mgr-disp').value.trim();
  const companySize = document.getElementById('f-company-size').value;
  const yearsExperience = document.getElementById('f-years-exp').value;
  const companyCulture = document.getElementById('f-company-culture').value;
  const batna = document.getElementById('f-batna').value.trim();
  const timeline = document.getElementById('f-timeline').value.trim();
  const framework = 'seven';
  if(!name || !title || !goal) return;

  const prefill = { name, title, goal, mgrName, mgrDisp, companySize, yearsExperience, companyCulture, batna, timeline };
  const existingScenarioId = draft ? draft.existingScenarioId : null;
  draft = { prefill, framework, concepts: [], existingScenarioId };

  VIEW = 'plan';
  planLoading = true;
  render();

  const plan = await generatePlan(prefill, framework);
  draft.plan = plan;
  planLoading = false;
  render();
}

async function onRegeneratePlan(){
  planLoading = true; render();
  const plan = await generatePlan(draft.prefill, draft.framework);
  draft.plan = plan;
  planLoading = false;
  render();
}

async function generatePlan(prefill, framework){
  const lengthNote = RESPONSE_DETAIL === 'detailed'
    ? ' In detailed mode, stretch further: analyses can run to 4 sentences, use the full 5 bullets, and scripts can run to 2-3 sentences.'
    : ' In concise mode, keep analyses to 2-3 sentences and use 3 bullets — still substantive, just economical.';
  const system = `You are refining a negotiation plan based on context established in a previous step (see CONTEXT in the user message). Treat the CONTEXT as ground truth — do not question it. If it's thin, make it more robust yourself: reasonably flesh it out rather than leaving gaps, and flag anything you added as "[Assumption: ...]".

This is prep for an actual upcoming conversation, not a generic explainer — every section must be specific enough to use as a script, grounded in the real details given, never generic negotiation advice that could apply to anyone.

Output ONLY valid JSON, no preamble, no markdown fences, matching exactly this schema:
{"context":string,"sections":[{"title":string,"analysis":string,"bullets":[string,...],"script":string,"risk":string}],"recommendedOpeningMove":string,"whereExposed":[string,...]}

- "context": a robust restatement of the situation, roughly 10-15 short lines (separate with \\n), covering who's involved, the ask, constraints, and anything else load-bearing. If the given input is thin, flesh it out with reasonable, clearly-useful specifics rather than leaving it sparse.
- "sections": produce exactly 7, titled in this order: "Interests", "Legitimacy", "Relationships", "Alternatives (BATNA/WATNA)", "Options", "Commitments", "Communication". For each: "analysis" reasons from the context (the "why", not just the label); "bullets" are concrete specifics tied to the actual situation, role, manager, and numbers given; "script" is at least one ready-to-use sentence or two, written as the literal bare words to say out loud, with NO surrounding quotation marks (the display already adds them — quoting a quote inside another quote is a mistake to avoid); "risk" is one specific failure mode for that element and how to avoid it.
- "recommendedOpeningMove": a literal script — the actual first 2-3 sentences to say, not a paraphrase or description. This one SHOULD be wrapped in its own quotation marks, since it's shown plain with no added quote styling.
- "whereExposed": 2-3 bullets naming the weakest parts of this specific plan given what's known, and what to firm up before the conversation.

Where critical information is missing (a real BATNA, the manager's likely constraints, market data, timeline) and it wasn't supplied in CONTEXT, do not silently invent specifics as if they were given — instead make the gap explicit with "[Assumption: ...]" at the point it's used, so it reads as a flagged gap, not a fabricated fact.${lengthNote}`;

  const userMsg = `CONTEXT (from a previous step — treat as ground truth):
- My name / title: ${prefill.name}, ${prefill.title}
- Goal of the ask: ${prefill.goal}
- Counterparty (manager): ${prefill.mgrName || 'unspecified'}, disposition: ${prefill.mgrDisp || 'unspecified'}
- Company size: ${prefill.companySize ? companySizeLabel(prefill.companySize) : 'unspecified'}
- Company culture: ${prefill.companyCulture ? companyCultureLabel(prefill.companyCulture) : 'unspecified'}
- My experience level: ${prefill.yearsExperience ? yearsExperienceLabel(prefill.yearsExperience) : 'unspecified'}
- My BATNA / best alternative: ${prefill.batna || 'not supplied'}
- Timeline: ${prefill.timeline || 'not supplied'}

TASK:
Rewrite and deepen this into a full negotiation plan using the 7 Elements of Negotiation (Harvard PON framework).

1. Interests — Go at least two layers deep: surface ask → what that ask is really about for me → what that reveals about my manager's constraints and interests too. Don't stop at "recognition" — get specific to what's actually driving it.
2. Legitimacy — Name the specific external references I could realistically bring (market data sources, internal comp bands, timing/precedent, scope changes) — not just "cite market data."
3. Relationships — Map the specific dynamic with this manager (style, pressures, history, from the disposition given) and how that should shape tone and sequencing, not generic "protect the relationship" advice.
4. Alternatives (BATNA/WATNA) — Use my supplied BATNA if given; if not supplied, do not invent one — flag it as a gap I need to fill myself. Reason through the manager's likely BATNA/cost of my walking away, specific to my role.
5. Options — A ranked package of at least 4 options (not just base/title/bonus), including at least one multi-part MESO-style package: 2-3 different full packages I'd be equally happy with, so I'm not negotiating on a single axis.
6. Commitments — The actual close: what to say to get a concrete next step, plus a fallback script if they stall.
7. Communication — A full sequencing plan (opening line → discovery questions → anchor → response to pushback), with at least 2 likely objections and a scripted response to each, folded into the analysis/bullets/script fields.

Return only the JSON object.`;
  const result = await askAI(system, [{role:'user', content:userMsg}], true);
  if(result && Array.isArray(result.sections) && result.sections.length) return result;
  return fallbackPlan(prefill);
}

function fallbackPlan(prefill){
  const goal = (prefill.goal || 'a raise').replace(/\.+\s*$/, '');
  const mgrName = prefill.mgrName || 'your manager';
  const batnaLine = prefill.batna
    ? `Your stated alternative: ${prefill.batna}.`
    : '[Assumption: no BATNA was supplied] You have not named a real alternative yet — do this before the conversation, even if you never plan to use it.';
  const timelineLine = prefill.timeline
    ? `Timeline: ${prefill.timeline}.`
    : '[Assumption: no timeline was supplied] No specific timing constraint is known — assume a standard review cycle unless you have reason to move faster.';
  return {
    context: [
      `${prefill.name || 'You'} (${prefill.title || 'your role'}) is preparing to ask ${mgrName} for: ${goal}.`,
      `Manager disposition: ${prefill.mgrDisp || '[Assumption: not supplied] assume moderately firm, budget-conscious, not a pushover.'}`,
      `Company size: ${prefill.companySize ? companySizeLabel(prefill.companySize) : '[Assumption: not supplied] assume a mid-size company with some but not unlimited budget flexibility.'}`,
      `Company culture: ${prefill.companyCulture ? companyCultureLabel(prefill.companyCulture) : '[Assumption: not supplied] assume a fairly standard corporate approval process.'}`,
      `Experience level: ${prefill.yearsExperience ? yearsExperienceLabel(prefill.yearsExperience) : '[Assumption: not supplied] assume solid, established tenure in the role.'}`,
      batnaLine,
      timelineLine,
      'This plan was generated offline (the AI service was unavailable) using only the details above — treat the [Assumption] tags as gaps to fill in yourself before the real conversation.',
    ].join('\n'),
    sections: [
      { title:'Interests', analysis:`Look past the number to what ${prefill.name || 'you'} actually need, and what that reveals about your manager's own constraints.`, bullets:[`[Assumption: no deeper motivation was given] The underlying driver is likely recognition for unrewarded scope — name that directly, not just "${goal}".`, `Your manager's interest is probably protecting budget precedent and their own credibility with their boss.`, 'Distinguish the stated ask from the real "why" when you speak, so the conversation isn\'t just about the number.'], script:`This isn't just about the number for me — it's about ${goal.toLowerCase()} being recognized as a real step up in scope.`, risk:'Leading with the number instead of the reason makes it easy to say no. Lead with the "why."' },
      { title:'Legitimacy', analysis:'Bring an external reference point so the ask reads as fair and non-negotiable-on-principle, not personal.', bullets:['Cite market-rate data for the role/level, if you have or can find it.', 'Point to the specific scope or impact you have absorbed since the last comp change.', 'Reference internal comp bands or precedent if you know of any comparable case.'], script:`Based on what similar roles are paying and the scope I've picked up, this feels like a fair, defensible ask.`, risk:'An ask with no external anchor reads as opinion, not fact — always have at least one reference point ready.' },
      { title:'Relationships', analysis:`Protect the working relationship with ${mgrName} regardless of outcome — this is a repeated game, not a one-shot.`, bullets:['Frame the ask as solving a shared problem, not a demand against your manager.', 'Watch for tension between pushing your case and preserving trust; de-escalate if the tone shifts.', '[Assumption: limited relationship history given] Calibrate tone to their disposition rather than assuming familiarity.'], script:`I want this to work well for both of us — I'm not trying to put you in a hard spot.`, risk:'Pushing too hard too fast can read as adversarial. Sequence firmness after rapport, not before.' },
      { title:'Alternatives (BATNA/WATNA)', analysis:'Know your walk-away, and reason through theirs — never reveal either directly.', bullets:[batnaLine, "The manager's likely BATNA is doing nothing and absorbing the risk you might disengage or leave — weigh how much that actually costs them.", 'Never state your BATNA or any timeline explicitly during the conversation.'], script:`I have options I'm considering, but I'd genuinely rather make this work here.`, risk:'Revealing your BATNA or a deadline hands over your leverage. Keep it implied, never stated.' },
      { title:'Options', analysis:'Have more than one way to get to yes, including at least one creative package, so you\'re not negotiating on a single axis.', bullets:['Base comp increase as the primary ask.', 'Title or scope change as an alternate or additional lever.', 'A creative package: earlier review date + smaller base bump, in exchange for locking in the title change now.', 'A third package: flexible/remote terms plus a modest increase, if base budget is the real constraint.'], script:`There's more than one way to get me to yes here — happy to talk through what's actually flexible on your end.`, risk:'Anchoring on a single number turns this into a win/lose haggle. Bring packages, not just a figure.' },
      { title:'Commitments', analysis:'Leave with something concrete, not just a promise to "look into it".', bullets:['Ask for a specific decision date, not an open-ended "let me think".', 'Propose a fallback commitment (e.g. a scheduled follow-up) if the full ask can\'t be met today.', 'Get agreement in writing (a follow-up email) once you have a verbal yes.'], script:`Can we agree on a specific date to close this out, even if the answer needs more time?`, risk:'Walking away with no next step lets the ask quietly die. Always close with a date.' },
      { title:'Communication', analysis:'Sequence the conversation so you understand their constraints before you anchor, and have objection responses ready.', bullets:['Open by asking about their constraints before stating your number, to avoid anchoring against yourself.', 'Objection: "there\'s no budget right now" → respond with the timeline/next-cycle option rather than dropping the ask.', 'Objection: "let me check with my manager" → ask for a specific date to hear back, and offer to help make the case.'], script:`Before I lay out what I'm thinking, what constraints are you working with this cycle?`, risk:'Anchoring before you understand their constraints wastes your best information. Ask first.' },
    ],
    recommendedOpeningMove: `"Hi ${mgrName}, do you have a few minutes? Before I get into specifics, I wanted to ask what constraints you're working with this cycle — I want to make sure what I'm proposing actually fits."`,
    whereExposed: [
      prefill.batna ? 'Your BATNA is named but its credibility is untested — make sure it would actually hold up if referenced indirectly.' : '[Assumption gap] No real BATNA was supplied — this plan cannot responsibly script your walk-away leverage until you supply one.',
      'Market data and internal comp bands are assumed, not confirmed — firm these up with real numbers before the conversation if at all possible.',
      prefill.timeline ? 'Timeline is known but the manager\'s own calendar/budget cycle constraints are still a guess — confirm if you can.' : '[Assumption gap] No timeline was supplied — the sequencing and urgency framing in this plan are generic until you add one.',
    ],
  };
}

async function onStartNegotiation(){
  let scenarioId = draft.existingScenarioId;
  if(!scenarioId){
    const gk = groupKeyFor(draft.prefill.name, draft.prefill.title, draft.prefill.goal);
    let sc = DATA.scenarios.find(s=>s.groupKey===gk);
    if(!sc){
      sc = await createScenario(draft.prefill, gk);
    }
    scenarioId = sc.id;
  }
  draft.scenarioId = scenarioId;
  draft.attemptId = uid();
  draft.transcript = [];
  draft.summaryTags = [];
  draft.createdAt = Date.now();
  draft.planCollapsed = false;
  await saveAttemptSnapshot();
  VIEW = 'live';
  render();
}

async function saveAttemptSnapshot(status){
  const record = {
    id: draft.attemptId,
    user_id: SESSION.user.id,
    scenario_id: draft.scenarioId,
    framework: draft.framework,
    concepts: draft.concepts,
    plan: draft.plan,
    transcript: draft.transcript,
    summary_tags: draft.summaryTags,
    outcome: draft.outcome || null,
    status: status || 'in-progress',
    created_at: new Date(draft.createdAt).toISOString(),
    updated_at: new Date().toISOString()
  };
  const { error } = await supabase.from('attempts').upsert(record);
  if(error) console.error('saveAttemptSnapshot failed', error);

  const local = {
    id: draft.attemptId, scenarioId: draft.scenarioId, framework: draft.framework, concepts: draft.concepts,
    plan: draft.plan, transcript: draft.transcript, summaryTags: draft.summaryTags,
    outcome: draft.outcome || null, status: status || 'in-progress', createdAt: draft.createdAt
  };
  const idx = DATA.attempts.findIndex(a=>a.id===draft.attemptId);
  if(idx>-1) DATA.attempts[idx] = local; else DATA.attempts.push(local);
}

async function onSendMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || liveLoading) return;
  draft.transcript.push({ role:'user', text });
  input.value = '';
  liveLoading = true;
  render();

  const mgrName = draft.prefill.mgrName || 'the manager';
  const mgrDisp = draft.prefill.mgrDisp || 'no particular disposition specified — play it realistically neutral';
  const lengthNote = RESPONSE_DETAIL === 'detailed'
    ? ' Replies can run a bit longer, 4-7 sentences, with more nuance and detail.'
    : ' Keep replies tight, 2-3 sentences.';
  const turnCount = draft.transcript.filter(m=>m.role==='user').length;
  const progressNote = turnCount >= 5
    ? ' The conversation has gone on for a while now — if the employee has given any legitimate justification across the conversation, this is a natural point to make a real concession, agree to concrete terms, or land on a clear next step rather than repeating an earlier objection.'
    : '';
  const contextNote = [
    draft.prefill.companySize ? 'Company size: ' + companySizeLabel(draft.prefill.companySize) + '.' : '',
    draft.prefill.yearsExperience ? "Employee's experience level: " + yearsExperienceLabel(draft.prefill.yearsExperience) + '.' : '',
    draft.prefill.companyCulture ? 'Company culture: ' + companyCultureLabel(draft.prefill.companyCulture) + '.' : '',
  ].filter(Boolean).join(' ');
  const system = `You are roleplaying as ${mgrName}, the manager in a salary raise negotiation with ${draft.prefill.name}, who holds the title "${draft.prefill.title}". Manager disposition: ${mgrDisp}. The employee's stated goal: ${draft.prefill.goal}.${contextNote ? ' ' + contextNote + ' Let this context genuinely shape your budget flexibility, approval process, and tone (e.g. a resource-constrained startup manager has less room to maneuver but can also move faster without red tape; a large enterprise manager may need to defer to process but often has bigger budget bands; more years of experience in the employee should be taken as a stronger, more credible case).' : ''}
Stay fully in character as the manager only — never break character, never give coaching advice, never speak as narrator.
Negotiate realistically, like a real person who wants a good outcome — not an obstacle designed to never yield. Open reasonably firm and probe with genuine questions or real constraints (budget cycles, precedent, needing to check with others), consistent with the disposition. But actually listen: when the employee gives strong, specific reasoning — data, market comparisons, concrete scope or impact — take it seriously and move, whether that's a partial concession, agreeing to specific terms, or committing to a clear next step. Don't repeat the same objection turn after turn without new movement, and don't stall indefinitely just to seem tough. It is completely fine, and often the right call, to agree to the ask (in full or in part) once the case for it is genuinely strong. Natural spoken dialogue, no stage directions, no markdown.${lengthNote}${progressNote}`;

  const apiMessages = draft.transcript.map(m=>({ role: m.role==='user'?'user':'assistant', content: m.text }));
  const reply = await askAI(system, apiMessages, false);
  draft.transcript.push({ role:'assistant', text: (reply||'').trim() || "...I need a moment to think about that." });
  liveLoading = false;
  render();

  updateLiveSummary();
  saveAttemptSnapshot();
}

async function updateLiveSummary(){
  summaryLoading = true;
  render();
  const system = `You extract a short running summary of a live salary negotiation roleplay. Output ONLY valid JSON: {"tags":[{"type":"anchor|pushback|term","text":"short phrase, max 10 words"}]}. Types: "anchor" for any number/range stated by either side, "pushback" for objections/constraints/counter-anchors raised by the manager, "term" for any non-price variable raised (timing, scope, title, start date, review cycle, etc). Keep the list to the most important 4-8 items across the whole conversation so far, most recent developments included. No duplicates.`;
  const transcriptText = draft.transcript.map(m=> (m.role==='user'?'Employee: ':'Manager: ') + m.text).join('\n');
  const result = await askAI(system, [{role:'user', content: 'Transcript so far:\n' + transcriptText}], true);
  if(result && result.tags) draft.summaryTags = result.tags;
  summaryLoading = false;
  render();
  saveAttemptSnapshot();
}

async function pauseAndExit(){
  if(!draft.transcript || draft.transcript.length===0){
    await deleteAttemptRecord(draft.attemptId);
  }
  draft = null;
  showLeaveDialog = false;
  VIEW = 'home';
  render();
}

async function closeWithAgreement(){
  draft.outcome = 'Manager agreed';
  await saveAttemptSnapshot('completed');
  draft = null;
  showLeaveDialog = false;
  VIEW = 'home';
  render();
}

async function onDiscardAttempt(){
  await deleteAttemptRecord(draft.attemptId);
  draft = null;
  showLeaveDialog = false;
  VIEW = 'home';
  render();
}

async function onSaveAndExit(){
  if(draft.transcript.length>0){
    const system = `Summarize the outcome of this salary negotiation roleplay in one short punchy tag, 3-6 words, e.g. "Held anchor", "Conceded early", "Manager agreed to review in Q1". Output ONLY valid JSON: {"outcome":"..."}`;
    const transcriptText = draft.transcript.map(m=> (m.role==='user'?'Employee: ':'Manager: ') + m.text).join('\n');
    const result = await askAI(system, [{role:'user', content: transcriptText}], true);
    draft.outcome = (result && result.outcome) ? result.outcome : 'Attempt recorded';
  } else {
    draft.outcome = 'Ended early';
  }
  await saveAttemptSnapshot('completed');
  draft = null;
  showLeaveDialog = false;
  VIEW = 'home';
  render();
}

/* ---------------- Boot ---------------- */
(async function init(){
  loadResponseDetail();
  await initAuth();
  if(SESSION){ await loadData(); }
  render();
})();
</script>
